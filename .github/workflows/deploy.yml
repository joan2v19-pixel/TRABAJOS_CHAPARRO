
name: Publicar Angular en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: EJERCICIO/package-lock.json

      - name: Instalar dependencias
        working-directory: EJERCICIO
        run: npm ci

      - name: Compilar Angular
        working-directory: EJERCICIO
        run: npx ng build --base-href /TRABAJOS_CHAPARRO/

      - name: Preparar publicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: EJERCICIO/dist/EJERCICIO/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
