<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Joan Sierra">
  <title>100 proyectos JS · 01 - Tinder Swipe</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div class="shadow">
    <main>
      <section>
        <div class="white-bkg"></div>

        <header>
          <img src="images/ui/tinder-logo.webp" alt="Logo de Tinder">
        </header>

        <div class="cards" id="cards">
          <span class="no-more">
            No hay más personas cerca de ti...<br>
            Vuelve a intentarlo más tarde
          </span>
        </div>

        <footer>
          <button class="is-undo"           aria-label="Deshacer"></button>
          <button class="is-remove is-big"  aria-label="Descartar"></button>
          <button class="is-star"           aria-label="Super like"></button>
          <button class="is-fav is-big"     aria-label="Me gusta"></button>
          <button class="is-zap"            aria-label="Boost"></button>
        </footer>
      </section>
    </main>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
